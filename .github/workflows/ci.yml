name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The generated Prisma client is gitignored and typecheck needs it; generate doesn't connect to the database.
      - run: npx prisma generate
        env:
          DIRECT_URL: postgresql://user:password@localhost:5432/devstash
      # Route types such as LayoutProps are generated by Next and aren't committed.
      - run: npx next typegen
      - run: npm run lint
      - run: npx tsc --noEmit
